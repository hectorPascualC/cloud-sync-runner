name: Probe variable API

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe repository variable API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/PRIVATE_CODE_REPOSITORY")"
          if [[ "$status" == "200" ]]; then
            echo "VARIABLE_API: OK"
          else
            echo "VARIABLE_API: HTTP_$status"
            exit 1
          fi
