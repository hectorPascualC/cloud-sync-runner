name: Bootstrap private repository deploy keys

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Generate and encrypt deploy keys
        env:
          STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$STATE_PASSPHRASE" ]]; then
            echo "::error::Missing protected state configuration."
            exit 1
          fi

          rm -rf .deploy-key-state deploy-keys
          mkdir -p .deploy-key-state deploy-keys

          ssh-keygen -q -t ed25519 -N "" -C "cloud-sync-code-read" -f "$RUNNER_TEMP/code_read_key"
          ssh-keygen -q -t ed25519 -N "" -C "cloud-sync-data-write" -f "$RUNNER_TEMP/data_write_key"

          install -m 644 "$RUNNER_TEMP/code_read_key.pub" deploy-keys/code-read.pub
          install -m 644 "$RUNNER_TEMP/data_write_key.pub" deploy-keys/data-write.pub

          printf '%s' "$STATE_PASSPHRASE"             | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0                 --symmetric --cipher-algo AES256                 --output .deploy-key-state/code-read.key.gpg                 "$RUNNER_TEMP/code_read_key"

          printf '%s' "$STATE_PASSPHRASE"             | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0                 --symmetric --cipher-algo AES256                 --output .deploy-key-state/data-write.key.gpg                 "$RUNNER_TEMP/data_write_key"

          chmod 600 .deploy-key-state/*.gpg
          rm -f "$RUNNER_TEMP/code_read_key" "$RUNNER_TEMP/code_read_key.pub"
          rm -f "$RUNNER_TEMP/data_write_key" "$RUNNER_TEMP/data_write_key.pub"

          test -s .deploy-key-state/code-read.key.gpg
          test -s .deploy-key-state/data-write.key.gpg
          test -s deploy-keys/code-read.pub
          test -s deploy-keys/data-write.pub

      - name: Publish non-sensitive public keys
        run: |
          set -euo pipefail
          git config user.name "cloud-sync-key-bootstrap"
          git config user.email "cloud-sync-key-bootstrap@users.noreply.github.com"
          git add deploy-keys/code-read.pub deploy-keys/data-write.pub
          if git diff --cached --quiet; then
            echo "Public deploy keys already published."
          else
            git commit -m "chore: publish deploy public keys"
            git push origin HEAD:main
          fi

      - name: Persist encrypted private keys
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deploy-key-state
          key: cloud-sync-deploy-keys-v1
