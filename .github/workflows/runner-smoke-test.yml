name: Runner smoke test

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  smoke:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[runner-smoke-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test
        run: echo "RUNNER_SMOKE_OK"
